<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Pixel do Legislativo: O Deputado nas Ruas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Header / HUD -->
    <header class="bg-slate-900 border-b-4 border-slate-700 p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-lg border-2 border-blue-400 font-bold text-lg pixel-font shadow-md">
                    🏛️
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold tracking-tight text-white pixel-font">LegisPixel: O Deputado</h1>
                    <p class="text-xs text-slate-400">Trabalho de Sociologia • Poder Legislativo</p>
                </div>
            </div>
            
            <!-- Game Stats HUD -->
            <div id="hud-stats" class="hidden flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-lg border-2 border-slate-700 text-xs">
                <div class="text-center">
                    <span class="text-[9px] uppercase font-semibold text-slate-400 block">Assinaturas</span>
                    <span id="stat-signatures" class="font-bold text-amber-400 pixel-font">0/4</span>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="text-center">
                    <span class="text-[9px] uppercase font-semibold text-slate-400 block">Aprovação</span>
                    <span id="stat-popularity" class="font-bold text-emerald-400 pixel-font">60%</span>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="text-center">
                    <span class="text-[9px] uppercase font-semibold text-slate-400 block">Etapa</span>
                    <span id="stat-phase" class="font-bold text-blue-400 pixel-font">Plenário</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Game Viewport -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto flex flex-col items-center">
        <div id="game-viewport" class="w-full bg-slate-800 border-4 border-slate-700 rounded-xl p-6 sm:p-8 shadow-2xl relative overflow-hidden retro-box min-h-[460px] flex flex-col justify-between">
            <!-- Conteúdo Dinâmico inserido via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t-2 border-slate-800 py-3 text-center text-xs text-slate-500">
        Simulador Didático Interativo • Desenvolvido em HTML5 & JavaScript
    </footer>

    <!-- Diálogo Modal com Cidadãos nas Ruas -->
    <div id="dialogue-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-4 border-amber-500/80 rounded-xl max-w-lg w-full p-6 shadow-2xl retro-box">
            <div class="flex items-center gap-3 mb-3">
                <span id="dialogue-avatar" class="text-3xl">👤</span>
                <div>
                    <h3 id="dialogue-speaker" class="text-xs sm:text-sm font-bold text-amber-400 pixel-font">Cidadão</h3>
                    <span class="text-[10px] text-slate-400">Conversas nas Ruas da Cidade</span>
                </div>
            </div>
            <p id="dialogue-text" class="text-xs sm:text-sm text-slate-200 mb-6 leading-relaxed bg-slate-800 p-4 rounded-lg border border-slate-700"></p>
            <div id="dialogue-options" class="space-y-2">
                <!-- Opções dinâmicas -->
            </div>
        </div>
    </div>

    <!-- Modal de Feedback -->
    <div id="feedback-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-4 border-blue-500/80 rounded-xl max-w-md w-full p-6 shadow-2xl retro-box text-center">
            <div id="feedback-icon" class="text-4xl mb-3">✅</div>
            <h3 id="feedback-title" class="text-xs sm:text-sm font-bold text-white mb-2 pixel-font">Resultado</h3>
            <p id="feedback-message" class="text-xs sm:text-sm text-slate-300 mb-6 leading-relaxed"></p>
            <button onclick="closeFeedbackModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg retro-btn pixel-font text-xs">
                Continuar
            </button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
